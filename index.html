<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MokTrak">
<title>MokTrak</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#wrap{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#wrap{position:relative}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:manipulation}
#hud,#fps{position:absolute;z-index:5;color:#00ff88;background:#0009;border:1px solid #00ff8844;border-radius:14px;font:600 11px monospace;padding:6px 9px;text-shadow:0 1px 3px #000}
#hud{top:10px;right:10px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fps{top:10px;left:10px}
#hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#000c;border:1px solid #00ff88;color:#00ff88;padding:12px 18px;border-radius:20px;text-align:center;font-size:13px;max-width:85%}
#panel{position:absolute;z-index:5;right:8px;top:50%;transform:translateY(-50%);display:none;pointer-events:none;min-width:122px;max-width:146px;background:#0009;backdrop-filter:blur(4px);border:1px solid #00ff8855;border-radius:11px;padding:8px;color:#fff;font:11px ui-monospace,monospace;line-height:1.55;text-shadow:0 1px 3px #000}
#panel .title{font-weight:800;color:#00ff88;border-bottom:1px solid #00ff8844;padding-bottom:4px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px}
.k{color:#00ff8899}.v{color:#fff;font-weight:700}
.good{color:#00ff88}.warn{color:#ffca28}.bad{color:#ff5252}
button{font-family:system-ui,sans-serif;font-weight:700;cursor:pointer}
#startBtn{position:absolute;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);border:0;border-radius:28px;background:#00ff88;color:#00180d;padding:15px 25px;font-size:16px;box-shadow:0 5px 24px #00ff8844;white-space:nowrap}
#startBtn:disabled{opacity:.7}
#resetBtn,#switchBtn{position:absolute;z-index:7;top:49px;border:1px solid #00ff8866;border-radius:18px;background:#001a10dd;color:#00ff88;padding:7px 11px;font-size:12px;display:none}
#resetBtn{right:10px}#switchBtn{right:66px}
#err{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:440px;background:#180000f2;border:1px solid #ff5252;border-radius:12px;padding:16px;color:#ff7777;font-size:13px;line-height:1.6;white-space:pre-wrap}
#statusBar{position:absolute;z-index:6;top:42px;left:50%;transform:translateX(-50%);background:#0009;color:#00ff88;font:600 10px monospace;padding:4px 10px;border-radius:10px;border:1px solid #00ff8833;display:none;max-width:90%}
#espBar{position:absolute;z-index:7;top:80px;right:10px;display:flex;gap:6px;align-items:center;background:#0009;border:1px solid #00ff8844;border-radius:14px;padding:6px 9px;font:600 10px monospace;backdrop-filter:blur(4px)}
#espBar input{background:#001a10;border:1px solid #00ff8855;border-radius:8px;color:#00ff88;padding:4px 7px;font:600 10px monospace;width:100px;outline:none}
#espBar input:focus{border-color:#00ff88}
#espBtn{background:#00ff88;color:#00180d;border:0;border-radius:8px;padding:4px 9px;font:700 10px system-ui}
#espBtn.off{background:#444;color:#aaa}
#espDot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0}
#espDot.on{background:#00ff88;box-shadow:0 0 8px #00ff88}
#espDot.off{background:#ff5252}
#espDot.mid{background:#ffca28}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">MokTrak · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="statusBar"></div>
  <div id="hint">المس الكائن الذي تريد تتبعه</div>
  <div id="panel"></div>
  <div id="espBar">
    <span id="espDot"></span>
    <input id="espIP" type="text" placeholder="192.168.1.50" inputmode="numeric">
    <button id="espBtn" class="off">ربط</button>
  </div>
  <button id="resetBtn">إلغاء القفل ✕</button>
  <button id="switchBtn">تبديل الكاميرا</button>
  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div>
</div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════
//  القسم 1: التخزين المؤقت (مكتبات + أوزان الموديل)
// ═══════════════════════════════════════════════

const CACHE_NAME = 'moktrak-v2';
const TF_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js';
const COCO_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js';

const $ = id => document.getElementById(id);
const statusBar = $('statusBar');

function setStatus(msg, visible) {
  statusBar.textContent = msg;
  statusBar.style.display = visible === false ? 'none' : 'block';
}

// ═══ اعتراض fetch لتخزين أوزان الموديل ═══
const _originalFetch = window.fetch ? window.fetch.bind(window) : null;
if (_originalFetch) {
  window.fetch = async function(input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';

    // تحقق هل هو رابط أوزان موديل
    const isModelUrl =
      url.includes('storage.googleapis.com') ||
      url.includes('tfhub.dev') ||
      url.includes('tfjs-models') ||
      url.endsWith('.bin') ||
      url.endsWith('model.json');

    if (!isModelUrl || !('caches' in window)) {
      return _originalFetch(input, init);
    }

    try {
      const cache = await caches.open(CACHE_NAME);
      const cached = await cache.match(url);
      if (cached) {
        console.log('📦 من الكاش:', url);
        return cached;
      }
      const response = await _originalFetch(input, init);
      if (response && response.ok) {
        cache.put(url, response.clone());
        console.log('⬇ حُمّل وخُزّن:', url);
      }
      return response;
    } catch (e) {
      console.warn('❌ فشل التحميل:', url, e.message);
      throw e;
    }
  };
}

// ═══ تحميل سكربت من الكاش أو الشبكة ═══
async function loadScriptFromCache(url) {
  if (!('caches' in window)) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = url;
      s.onload = res;
      s.onerror = () => rej(new Error('فشل تحميل: ' + url));
      document.head.appendChild(s);
    });
  }
  const cache = await caches.open(CACHE_NAME);
  let response = await cache.match(url);
  if (!response) {
    setStatus('⬇ تحميل المكتبات (مرة واحدة)…');
    try {
      response = await fetch(url, { mode: 'cors' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      await cache.put(url, response.clone());
    } catch (e) {
      throw new Error('⚠ لا يوجد اتصال والمكتبة غير مخزّنة — افتح مرة مع إنترنت أولًا');
    }
  } else {
    setStatus('📦 مكتبات من الكاش');
  }
  const text = await response.text();
  const blob = new Blob([text], { type: 'application/javascript' });
  const blobUrl = URL.createObjectURL(blob);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = blobUrl;
    s.onload = () => { URL.revokeObjectURL(blobUrl); res(); };
    s.onerror = () => { URL.revokeObjectURL(blobUrl); rej(new Error('فشل تنفيذ السكربت')); };
    document.head.appendChild(s);
  });
}

async function ensureLibraries() {
  if (window.tf && window.cocoSsd) { setStatus('', false); return; }
  setStatus('🔧 تهيئة المكتبات…');
  if (!window.tf) await loadScriptFromCache(TF_URL);
  if (!window.cocoSsd) await loadScriptFromCache(COCO_URL);
  setStatus('', false);
}

// ═══════════════════════════════════════════════
//  القسم 2: متغيرات التطبيق
// ═══════════════════════════════════════════════

const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d', { alpha: true });
const wrap = $('wrap'), hud = $('hud'), fpsEl = $('fps'), panel = $('panel');
const startBtn = $('startBtn'), resetBtn = $('resetBtn'), switchBtn = $('switchBtn');
const hint = $('hint'), err = $('err');

const CFG = {
  minScore: 0.42, detectEveryMs: 320, detectMax: 5,
  patchHalf: 22, searchHalf: 12, templateUpdateFrames: 14, sadThreshold: 3800,
  smoothing: 0.62, maxLostMs: 1400, maxPredictMs: 520, reacquireR: 1.5,
  grayW: 320, grayH: 240, frameIntervalMs: 26
};

let model = null, stream = null, running = false, facing = 'environment', busy = false;
let tracks = [], nextId = 1, lockedId = null, selected = null;
let lastDetect = 0, lastFrame = 0, fpsN = 0, fpsT = performance.now();
let rafId = 0, lastTap = 0, lockOrigin = null, frameCount = 0;
let template = null, templateBox = null, lastTrackedPos = null;

const grayCanvas = document.createElement('canvas');
grayCanvas.width = CFG.grayW; grayCanvas.height = CFG.grayH;
const grayCtx = grayCanvas.getContext('2d', { willReadFrequently: true });
let grayData = null;

// ═══════════════════════════════════════════════
//  القسم 3: ESP8266
// ═══════════════════════════════════════════════

const espSender = {
  ip: localStorage.getItem('moktrak_esp_ip') || '',
  enabled: false, interval: 80, lastSend: 0, ok: false, fails: 0, timer: null,
  setIP(v) {
    this.ip = (v || '').trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (this.ip) localStorage.setItem('moktrak_esp_ip', this.ip);
    else localStorage.removeItem('moktrak_esp_ip');
  },
  ping() {
    if (!this.ip) return;
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => { self.ok = true; self.fails = 0; updateEspUI(); };
    img.src = `http://${this.ip}/status?_=${Date.now()}`;
    setTimeout(() => { if (self.fails > 0) { self.ok = false; updateEspUI(); } }, 1000);
  },
  send(sel) {
    if (!this.enabled || !this.ip) return;
    const now = performance.now();
    if (now - this.lastSend < this.interval) return;
    this.lastSend = now;
    if (!sel || lockedId === null) { this._fire(`http://${this.ip}/t?live=0`); return; }
    const W = video.videoWidth || 640, H = video.videoHeight || 480;
    const c = center(sel.box);
    const x = Math.round(c[0] - W / 2), y = Math.round(c[1] - H / 2);
    const w = Math.round(sel.box[2]), h = Math.round(sel.box[3]);
    const vx = Math.round(sel.velocity[0] * (W / CFG.grayW));
    const vy = Math.round(sel.velocity[1] * (H / CFG.grayH));
    const sp = Math.round(Math.hypot(vx, vy));
    const live = sel.live ? 1 : 0;
    this._fire(`http://${this.ip}/t?x=${x}&y=${y}&w=${w}&h=${h}&vx=${vx}&vy=${vy}&s=${sp}&live=${live}`);
  },
  _fire(url) {
    const self = this;
    const img = new Image();
    img.onload = img.onerror = () => { self.ok = true; self.fails = 0; updateEspUI(); };
    img.src = url + '&_=' + Date.now();
    clearTimeout(self.timer);
    self.timer = setTimeout(() => {
      self.fails++;
      if (self.fails >= 3) { self.ok = false; updateEspUI(); }
    }, 400);
  }
};

function updateEspUI() {
  const dot = document.getElementById('espDot');
  const btn = document.getElementById('espBtn');
  if (!dot) return;
  dot.className = 'espDot ' + (espSender.enabled ? (espSender.ok ? 'on' : 'off') : '');
  if (espSender.enabled && !espSender.ok && espSender.fails < 3) dot.className = 'espDot mid';
  btn.classList.toggle('off', !espSender.enabled);
  btn.textContent = espSender.enabled ? 'قطع' : 'ربط';
}

(function initEsp() {
  const ipInput = document.getElementById('espIP');
  const btn = document.getElementById('espBtn');
  if (!ipInput || !btn) return;
  if (espSender.ip) ipInput.value = espSender.ip;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (espSender.enabled) { espSender.enabled = false; espSender.ok = false; updateEspUI(); return; }
    const v = ipInput.value.trim();
    if (!v) { ipInput.focus(); return; }
    espSender.setIP(v);
    espSender.enabled = true; espSender.fails = 0;
    espSender.ping(); updateEspUI();
  });
  ipInput.addEventListener('keypress', e => { if (e.key === 'Enter') btn.click(); });
  updateEspUI();
})();

// ═══════════════════════════════════════════════
//  القسم 4: أدوات
// ═══════════════════════════════════════════════

function showError(m) { err.style.display = 'block'; err.textContent = m; }
function hideError() { err.style.display = 'none'; }

function resize() {
  const r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 350));
resize();

function fit() {
  const r = wrap.getBoundingClientRect(), vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const scale = Math.max(r.width / vw, r.height / vh);
  return { scale, ox: (r.width - vw * scale) / 2, oy: (r.height - vh * scale) / 2, vw, vh, w: r.width, h: r.height };
}
function v2s(x, y, f) { return [f.ox + x * f.scale, f.oy + y * f.scale]; }
function s2v(clientX, clientY) {
  const r = canvas.getBoundingClientRect(), f = fit();
  return [(clientX - r.left - f.ox) / f.scale, (clientY - r.top - f.oy) / f.scale];
}
function clampBox(b) {
  const W = video.videoWidth || 640, H = video.videoHeight || 480;
  const w = Math.max(8, Math.min(W, b[2])), h = Math.max(8, Math.min(H, b[3]));
  return [Math.max(0, Math.min(W - w, b[0])), Math.max(0, Math.min(H - h, b[1])), w, h];
}
function center(b) { return [b[0] + b[2] / 2, b[1] + b[3] / 2]; }
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / (a[2] * a[3] + b[2] * b[3] - inter || 1);
}
function smoothBox(o, n, a) { return o.map((v, i) => v * (1 - a) + n[i] * a); }

// ═══════════════════════════════════════════════
//  القسم 5: التتبع البصري SAD
// ═══════════════════════════════════════════════

function grabGray() {
  if (video.readyState < 2) return null;
  grayCtx.drawImage(video, 0, 0, CFG.grayW, CFG.grayH);
  const img = grayCtx.getImageData(0, 0, CFG.grayW, CFG.grayH);
  if (!grayData || grayData.length !== img.data.length) grayData = new Uint8ClampedArray(img.data.length);
  grayData.set(img.data);
  return grayData;
}

function extractPatch(gray, cx, cy, half) {
  const x0 = Math.round(cx - half), y0 = Math.round(cy - half);
  const size = half * 2 + 1;
  const patch = new Uint8Array(size * size);
  for (let y = 0; y < size; y++) {
    const sy = y0 + y;
    if (sy < 0 || sy >= CFG.grayH) continue;
    for (let x = 0; x < size; x++) {
      const sx = x0 + x;
      if (sx < 0 || sx >= CFG.grayW) continue;
      const idx = (sy * CFG.grayW + sx) * 4;
      patch[y * size + x] = (gray[idx] * 77 + gray[idx + 1] * 150 + gray[idx + 2] * 29) >> 8;
    }
  }
  return { patch, x0, y0, size };
}

function sad(a, b, size) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d < 0 ? -d : d; }
  return s / (size * size);
}

function trackPatch(gray) {
  if (!template || !templateBox || !gray) return null;
  const cx = templateBox.cx, cy = templateBox.cy;
  const half = CFG.patchHalf, sHalf = CFG.searchHalf, size = half * 2 + 1;
  let bestSAD = Infinity, bestX = cx, bestY = cy;
  const step1 = 3;
  for (let dy = -sHalf; dy <= sHalf; dy += step1) {
    for (let dx = -sHalf; dx <= sHalf; dx += step1) {
      const p = extractPatch(gray, cx + dx, cy + dy, half);
      const s = sad(template, p.patch, size);
      if (s < bestSAD) { bestSAD = s; bestX = cx + dx; bestY = cy + dy; }
    }
  }
  for (let dy = -step1 + 1; dy < step1; dy++) {
    for (let dx = -step1 + 1; dx < step1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const p = extractPatch(gray, bestX + dx, bestY + dy, half);
      const s = sad(template, p.patch, size);
      if (s < bestSAD) { bestSAD = s; bestX = bestX + dx; bestY = bestY + dy; }
    }
  }
  if (bestSAD > CFG.sadThreshold) return null;
  return { x: bestX, y: bestY, sad: bestSAD };
}

function updateTemplate(gray, cx, cy) {
  const p = extractPatch(gray, cx, cy, CFG.patchHalf);
  template = p.patch.slice();
  templateBox = { cx, cy };
}

function videoToGray(x, y) {
  return [x * CFG.grayW / (video.videoWidth || 640), y * CFG.grayH / (video.videoHeight || 480)];
}
function grayToVideo(x, y) {
  return [x * (video.videoWidth || 640) / CFG.grayW, y * (video.videoHeight || 480) / CFG.grayH];
}

// ═══════════════════════════════════════════════
//  القسم 6: القفل والتتبع
// ═══════════════════════════════════════════════

function lockOn(t) {
  lockedId = t.id;
  selected = {
    id: t.id, label: t.label, score: t.score, box: t.box.slice(),
    velocity: [0, 0], lastSeen: performance.now(), live: true
  };
  lockOrigin = center(t.box);
  resetBtn.style.display = 'block';
  switchBtn.style.display = 'block';
  panel.style.display = 'block';
  hint.style.display = 'none';
  hud.textContent = '🎯 ' + selected.label;
  const gray = grabGray();
  if (gray) {
    const [gx, gy] = videoToGray(selected.box[0] + selected.box[2] / 2, selected.box[1] + selected.box[3] / 2);
    updateTemplate(gray, gx, gy);
    lastTrackedPos = [gx, gy];
  }
}

function unlock() {
  lockedId = null; selected = null; lockOrigin = null;
  template = null; templateBox = null; lastTrackedPos = null;
  resetBtn.style.display = 'none';
  switchBtn.style.display = 'none';
  panel.style.display = 'none';
  hud.textContent = 'MokTrak · جاهز';
  if (espSender.enabled && espSender.ip) {
    const img = new Image();
    img.src = `http://${espSender.ip}/t?live=0&_=${Date.now()}`;
  }
}

function chooseAt(clientX, clientY) {
  const p = s2v(clientX, clientY);
  let best = null, bestD = Infinity;
  for (const t of tracks) {
    const b = t.box;
    const inside = p[0] >= b[0] && p[0] <= b[0] + b[2] && p[1] >= b[1] && p[1] <= b[1] + b[3];
    const d = dist(p, center(b));
    const score = inside ? d - 10000 : d;
    if (score < bestD) { bestD = score; best = t; }
  }
  if (best && bestD < Math.max(180, Math.hypot(best.box[2], best.box[3]))) lockOn(best);
  else if (lockedId !== null) unlock();
}

canvas.addEventListener('pointerup', e => {
  if (!running || e.target === startBtn) return;
  const now = performance.now();
  if (now - lastTap < 250) return;
  lastTap = now;
  chooseAt(e.clientX, e.clientY);
});
resetBtn.addEventListener('click', e => { e.stopPropagation(); unlock(); });

// ═══════════════════════════════════════════════
//  القسم 7: الكشف
// ═══════════════════════════════════════════════

async function detect(now) {
  if (!model || video.readyState < 2) return;
  const preds = await model.detect(video, CFG.detectMax * 2, CFG.minScore);
  const used = new Set(), fresh = [];
  for (const p of preds.slice(0, CFG.detectMax)) {
    const d = { label: p.class, score: p.score, box: p.bbox.slice(), lastSeen: now, velocity: [0, 0], live: true };
    let best = null, bestS = -Infinity;
    for (const t of tracks) {
      if (used.has(t.id)) continue;
      const same = t.label === d.label, over = iou(t.box, d.box);
      const dc = dist(center(t.box), center(d.box)) / Math.max(50, Math.hypot(t.box[2], t.box[3]));
      const s = over * 1.8 + Math.max(0, 1 - dc) * 0.6 + (same ? 0.6 : -1);
      if (s > bestS && same && dc < 1.5) { best = t; bestS = s; }
    }
    if (best) {
      used.add(best.id);
      const b = smoothBox(best.box, d.box, 0.58);
      fresh.push({ ...best, box: b, label: d.label, score: d.score, lastSeen: now, live: true });
    } else {
      fresh.push({ ...d, id: nextId++ });
    }
  }
  tracks = fresh;
  lastDetect = now;

  if (lockedId !== null && selected) {
    const c = center(selected.box);
    let bestD = null, bestScore = -Infinity;
    for (const d of preds) {
      if (d.class !== selected.label) continue;
      const dc = center(d.bbox);
      const n = dist(c, dc) / Math.max(40, Math.hypot(selected.box[2], selected.box[3]));
      if (n > CFG.reacquireR) continue;
      const over = iou(selected.box, d.bbox);
      const s = over * 2 + Math.max(0, 1 - n) * 0.8;
      if (s > bestScore) { bestScore = s; bestD = d; }
    }
    if (bestD) {
      selected.box = smoothBox(selected.box, bestD.bbox, 0.5);
      selected.score = bestD.score;
      selected.lastSeen = now;
      selected.live = true;
      const gray = grabGray();
      if (gray && frameCount % CFG.templateUpdateFrames === 0) {
        const [gx, gy] = videoToGray(bestD.bbox[0] + bestD.bbox[2] / 2, bestD.bbox[1] + bestD.bbox[3] / 2);
        updateTemplate(gray, gx, gy);
      }
    }
  }
}

// ═══════════════════════════════════════════════
//  القسم 8: التتبع البصري
// ═══════════════════════════════════════════════

function runPatchTracking(now) {
  if (lockedId === null || !selected || !template) return;
  const gray = grabGray();
  if (!gray) return;
  const res = trackPatch(gray);
  if (res) {
    const [vx, vy] = grayToVideo(res.x, res.y);
    const newBox = [vx - selected.box[2] / 2, vy - selected.box[3] / 2, selected.box[2], selected.box[3]];
    const old = selected.box.slice();
    selected.box = smoothBox(old, newBox, CFG.smoothing);
    selected.velocity = [
      selected.velocity[0] * 0.4 + (res.x - lastTrackedPos[0]) * 0.6,
      selected.velocity[1] * 0.4 + (res.y - lastTrackedPos[1]) * 0.6
    ];
    lastTrackedPos = [res.x, res.y];
    selected.lastSeen = now;
    selected.live = true;
    if (frameCount % CFG.templateUpdateFrames === 0) updateTemplate(gray, res.x, res.y);
    templateBox = { cx: res.x, cy: res.y };
  } else {
    const age = now - selected.lastSeen;
    if (age > CFG.maxLostMs) selected.live = false;
  }
}

// ═══════════════════════════════════════════════
//  القسم 9: الرسم
// ═══════════════════════════════════════════════

function drawCross(cx, cy, size, live) {
  ctx.save();
  ctx.strokeStyle = live ? '#00ff88' : '#ffca28';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = live ? 9 : 3;
  ctx.lineWidth = 2;
  const g = size * .28, a = size;
  ctx.beginPath();
  ctx.moveTo(cx - a, cy); ctx.lineTo(cx - g, cy);
  ctx.moveTo(cx + g, cy); ctx.lineTo(cx + a, cy);
  ctx.moveTo(cx, cy - a); ctx.lineTo(cx, cy - g);
  ctx.moveTo(cx, cy + g); ctx.lineTo(cx, cy + a);
  ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, g * .9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) {
    const ang = k * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath(); ctx.arc(cx, cy, a + 4, ang - .18, ang + .18); ctx.stroke();
  }
  ctx.restore();
}

function drawBox(b, live, label, score) {
  const f = fit(), p = v2s(b[0], b[1], f), q = v2s(b[0] + b[2], b[1] + b[3], f);
  const x = p[0], y = p[1], w = q[0] - p[0], h = q[1] - p[1];
  ctx.save();
  ctx.strokeStyle = live ? '#00ff88' : '#ffca28';
  ctx.lineWidth = 1.7;
  ctx.setLineDash(live ? [] : [5, 5]);
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = live ? 6 : 0;
  ctx.strokeRect(x, y, w, h);
  ctx.setLineDash([]);
  const c = Math.max(5, Math.min(w, h) * .13);
  ctx.lineWidth = 2.7;
  ctx.beginPath();
  ctx.moveTo(x, y + c); ctx.lineTo(x, y); ctx.lineTo(x + c, y);
  ctx.moveTo(x + w - c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + c);
  ctx.moveTo(x + w, y + h - c); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - c, y + h);
  ctx.moveTo(x + c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - c);
  ctx.stroke();
  ctx.restore();
  if (label) {
    const text = (live ? '● ' : '◌ ') + label + ' ' + Math.round((score || 0) * 100) + '%';
    ctx.save();
    ctx.font = 'bold 12px monospace';
    const tw = ctx.measureText(text).width;
    const ly = Math.max(4, y - 23);
    ctx.fillStyle = live ? '#00ff88' : '#ffca28';
    ctx.fillRect(x, ly, tw + 12, 21);
    ctx.fillStyle = '#00140a';
    ctx.fillText(text, x + 6, ly + 14);
    ctx.restore();
  }
  return { cx: x + w / 2, cy: y + h / 2, x, y, w, h };
}

function updatePanel(now) {
  if (!selected) return;
  const c = center(selected.box);
  const vx = selected.velocity[0], vy = selected.velocity[1];
  const relX = c[0] - (video.videoWidth / 2), relY = c[1] - (video.videoHeight / 2);
  const ox = lockOrigin ? c[0] - lockOrigin[0] : 0, oy = lockOrigin ? c[1] - lockOrigin[1] : 0;
  const speed = Math.hypot(vx, vy) * (video.videoWidth / CFG.grayW);
  const age = now - selected.lastSeen;
  let status = selected.live ? 'تتبع نشط' : 'استعادة', cls = selected.live ? 'good' : 'warn';
  if (age > CFG.maxLostMs) { status = 'فُقد'; cls = 'bad'; }
  panel.innerHTML = '<div class="title">🎯 ' + selected.label + '</div>' +
    '<div class="row"><span class="k">الحالة</span><span class="' + cls + '">' + status + '</span></div>' +
    '<div class="row"><span class="k">X</span><span class="v">' + relX.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">Y</span><span class="v">' + relY.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">ΔX</span><span class="v">' + (ox >= 0 ? '+' : '') + ox.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">ΔY</span><span class="v">' + (oy >= 0 ? '+' : '') + oy.toFixed(0) + '</span></div>' +
    '<div class="row"><span class="k">السرعة</span><span class="v">' + speed.toFixed(0) + '</span></div>';
  espSender.send(selected);
}

function render(now) {
  const r = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (lockedId !== null && selected) {
    const age = now - selected.lastSeen;
    let b = selected.box.slice(), live = selected.live && age < CFG.maxLostMs;
    if (!live && age <= CFG.maxPredictMs) {
      const dt = Math.min(CFG.maxPredictMs, age) / 1000;
      const scaleVx = selected.velocity[0] * (video.videoWidth / CFG.grayW);
      const scaleVy = selected.velocity[1] * (video.videoHeight / CFG.grayH);
      b = clampBox([b[0] + scaleVx * dt, b[1] + scaleVy * dt, b[2], b[3]]);
    }
    const d = drawBox(b, live, selected.label, selected.score);
    drawCross(d.cx, d.cy, Math.max(13, Math.min(d.w, d.h) * .11), live);
    const f = fit();
    ctx.save();
    ctx.strokeStyle = '#ffeb3b99'; ctx.lineWidth = 1; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(f.w / 2, f.h / 2); ctx.lineTo(d.cx, d.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(f.w / 2 - 8, f.h / 2); ctx.lineTo(f.w / 2 + 8, f.h / 2);
    ctx.moveTo(f.w / 2, f.h / 2 - 8); ctx.lineTo(f.w / 2, f.h / 2 + 8);
    ctx.stroke();
    ctx.restore();
    updatePanel(now);
    hud.textContent = live ? '🎯 ' + selected.label + ' · تتبع' : '⚠ ' + selected.label + ' · استعادة';
  } else {
    for (const t of tracks.slice(0, 6)) drawBox(t.box, true, t.label, t.score);
  }
}

// ═══════════════════════════════════════════════
//  القسم 10: الحلقة
// ═══════════════════════════════════════════════

async function frame() {
  if (!running) return;
  const now = performance.now();
  fpsN++;
  if (now - fpsT >= 1000) {
    fpsEl.textContent = (fpsN * 1000 / (now - fpsT)).toFixed(0) + ' fps';
    fpsN = 0; fpsT = now;
  }
  if (video.readyState >= 2 && now - lastFrame > CFG.frameIntervalMs) {
    lastFrame = now;
    frameCount++;
    if (lockedId !== null && selected) runPatchTracking(now);
    if (!busy && model && now - lastDetect >= CFG.detectEveryMs) {
      busy = true;
      try { await detect(now); } catch (e) {} finally { busy = false; }
    }
    render(now);
  }
  rafId = requestAnimationFrame(frame);
}

// ═══════════════════════════════════════════════
//  القسم 11: التشغيل
// ═══════════════════════════════════════════════

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = 'جارٍ التحميل…';
  hideError();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('الكاميرا تحتاج HTTPS. افتح الملف عبر GitHub Pages.');
    }

    await ensureLibraries();

    if (!window.cocoSsd || !window.tf) {
      throw new Error('تعذر تحميل المكتبات');
    }

    hud.textContent = 'تحميل الموديل…';
    setStatus('🧠 جلب موديل الكشف…');

    if (!model) {
      try {
        // جرّب تحميل الأوزان من الكاش أولًا
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        setStatus('✅ الموديل جاهز');
      } catch (e) {
        // فشل → تحقق من الكاش
        const cache = await caches.open(CACHE_NAME);
        const keys = await cache.keys();
        const hasModel = keys.some(k => k.url.includes('ssdlite') || k.url.includes('model.json') || k.url.includes('.bin'));
        if (!hasModel) {
          throw new Error('⚠ الموديل غير مخزّن — افتح مرة واحدة مع إنترنت');
        }
        throw e;
      }
    }
    setStatus('', false);

    hud.textContent = 'تشغيل الكاميرا…';
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 640 }, height: { ideal: 480 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await new Promise((res, rej) => {
      if (video.readyState >= 1) { res(); return; }
      video.onloadedmetadata = res;
      setTimeout(() => rej(new Error('انتهت مهلة الكاميرا')), 10000);
    });
    await video.play();
    resize();

    running = true;
    startBtn.style.display = 'none';
    switchBtn.style.display = 'block';
    hud.textContent = 'MokTrak · جاهز';
    hint.style.display = 'block';
    setTimeout(() => hint.style.display = 'none', 5500);
    frame();
  } catch (e) {
    showError('تعذر التشغيل: ' + (e.message || e) + '\n\n' +
      'تحقق من:\n' +
      '• السماح بالكاميرا\n' +
      '• فتح الرابط عبر HTTPS\n' +
      '• أول تشغيل يحتاج إنترنت (مرة واحدة فقط)');
    hud.textContent = 'تعذر التشغيل';
    startBtn.disabled = false;
    startBtn.textContent = '↻ إعادة المحاولة';
    setStatus('', false);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}

async function switchCamera() {
  if (!running) return;
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  running = false;
  cancelAnimationFrame(rafId);
  unlock();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 640 }, height: { ideal: 480 },
        frameRate: { ideal: 30, max: 30 }
      }
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    lastDetect = 0;
    tracks = [];
    frame();
  } catch (e) {
    showError('تعذر تبديل الكاميرا: ' + e.message);
    running = false;
  }
}

startBtn.addEventListener('click', start);
switchBtn.addEventListener('click', switchCamera);
window.addEventListener('pagehide', () => {
  running = false;
  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (espSender.enabled && espSender.ip) {
    const img = new Image();
    img.src = `http://${espSender.ip}/t?live=0`;
  }
});

window.addEventListener('offline', () => setStatus('📴 وضع بدون إنترنت'));
window.addEventListener('online', () => setTimeout(() => setStatus('', false), 1500));

})();
// تسجيل Service Worker
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js')
    .then(r => console.log('✅ SW مسجّل:', r.scope))
    .catch(e => console.warn('⚠ SW فشل:', e));
}
</script>
